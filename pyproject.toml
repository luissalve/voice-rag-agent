[project]
name = "voice-rag-agent"
version = "0.1.0"
description = "Demo v1: ask a PDF by phone or web — FastAPI + Claude + pgvector + ElevenLabs Conversational AI + Twilio."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Monsalve", url = "https://novaiflow.com" }]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.72.0",
    "elevenlabs>=2.20.0",
    "twilio>=9.11.1",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
